---
# Collections used by the provisioning roles, for LOCAL runs only.
# CyberRangeCZ installs only the roles of requirements.yml; its Ansible runner
# already ships these collections (verified in the deploy log, ansible-core 2.16).
# Kept out of requirements.yml so the platform no longer warns about them.
#   ansible-galaxy collection install -r requirements-collections.yml
collections:
  - name: community.docker
    version: ">=3.4.0"
  - name: community.crypto
    version: ">=2.10.0"
  - name: ansible.posix
    version: ">=1.5.0"
